#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

primary_region = "lhr"
swap_size_mb = 128

[build]
  image = "ghcr.io/jackusm/vw:sha-e43684a"

[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
