name: Release

on:
  pull_request:
    types:
      - closed

jobs:
  release:
    runs-on: ubuntu-latest
    if: "github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'vaultwarden-update') || contains(github.event.pull_request.title, 'ghcr.io/dani-garcia/vaultwarden docker tag'))"
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Vaultwarden Version
        id: get_vaultwarden_version
        run: |
          echo "VAULTWARDEN_VERSION=$(grep 'dani-garcia/vaultwarden' vaultwarden-fly-io/Dockerfile | cut -d':' -f2 | cut -d'-' -f1)" >> $GITHUB_OUTPUT

      - name: Tag and create release
        id: create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Patch-bump previous tag; tag manually for minor/major bumps.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0)
          NEW_TAG=$(echo "$PREVIOUS_TAG" | awk -F. '{print $1"."$2"."$3+1}')
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          COMMITS=$(git log "$PREVIOUS_TAG..HEAD" --pretty=format:'- %h %s')
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          VERSION="${{ steps.get_vaultwarden_version.outputs.VAULTWARDEN_VERSION }}"
          if [ -n "$VERSION" ]; then
            gh release create "$NEW_TAG" --title "$NEW_TAG (vaultwarden $VERSION)" --notes "$COMMITS"
          else
            gh release create "$NEW_TAG" --notes "$COMMITS"
          fi

      - name: Trigger Build workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yaml --ref ${{ steps.create_tag.outputs.NEW_TAG }}
